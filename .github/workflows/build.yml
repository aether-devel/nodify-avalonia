name: Build

on:
  push:
    branches: ["main", "develop", "release/*", "master", "release-v*", "avalonia_port"]
    paths-ignore:
      - "docs/**"
  pull_request:
    paths-ignore:
      - "docs/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"
      - name: Build
        run: |
          dotnet workload restore
          dotnet build --configuration Release
      - name: Test
        run: dotnet test Nodify.Tests/Nodify.Tests.csproj --configuration Release --no-build
